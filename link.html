<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPD Simulator - Links</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            max-width: 600px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }
        h1 { color: #58a6ff; font-size: 1.6rem; margin-bottom: 10px; }
        p.subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 40px; }
        .link-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111622;
            border: 1px solid #21262d;
            color: #58a6ff;
            padding: 16px 20px;
            margin: 14px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .link-box:hover {
            background: #161b22;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: #58a6ff; }
        footer {
            border-top: 1px solid #30363d;
            margin-top: 60px;
            padding-top: 20px;
            color: #8b949e;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>// SYSTEM_LINKS</h1>
    <p class="subtitle">Official project links.</p>

    <div id="links-container">
        <p style="color: #8b949e;">[Loading route table...]</p>
    </div>

    <div>
        <a class="back-link" href="index.html">&lt; Return to Devblog</a>
    </div>

    <footer>
        &copy; 2026 NEXTSTARS & NEXTSTARS DEVELOPMENT. All rights reserved.
    </footer>

    <script>
        fetch('https://nextstars-development.github.io/lapdsimulator-devlog/devlog.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('links-container');
                container.innerHTML = '';
                
                const links = data.links;
                for (const [key, url] of Object.entries(links)) {
                    const a = document.createElement('a');
                    a.className = 'link-box';
                    a.href = url;
                    a.target = '_blank';
                    a.innerHTML = `<span>> ${key.toUpperCase()}</span><span>&#8599;</span>`;
                    container.appendChild(a);
                }
            })
            .catch(error => {
                document.getElementById('links-container').innerHTML = '<p style="color: #f85149;">[Error: Failed to fetch links]</p>';
            });
    </script>
</body>
</html>
