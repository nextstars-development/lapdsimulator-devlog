<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPD Simulator - Links</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 { color: #58a6ff; }
        p { color: #8b949e; }
        .link-box {
            display: block;
            background: #161b22;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .link-box:hover {
            background: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>
    <h1>// LINKS</h1>
    
    <div id="links-container">
        <p>Loading links...</p>
    </div>

    <a class="link-box" href="index.html">📄 Back to Devblog</a>

    <script>
        fetch('devlog.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('links-container');
                container.innerHTML = '';
                
                const links = data.links;
                for (const [key, url] of Object.entries(links)) {
                    const a = document.createElement('a');
                    a.className = 'link-box';
                    a.href = url;
                    a.target = '_blank';
                    a.textContent = key.toUpperCase();
                    container.appendChild(a);
                }
            })
            .catch(error => {
                document.getElementById('links-container').innerHTML = '<p>Error loading links.</p>';
            });
    </script>
</body>
</html>
