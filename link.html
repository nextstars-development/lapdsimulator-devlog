<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPD Simulator - Links</title>
    <style>
        body {
            background: #090d16;
            color: #d1d5db;
            font-family: monospace;
            max-width: 500px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }
        h1 { color: #38bdf8; font-size: 1.4rem; margin-bottom: 5px; }
        .subtitle { color: #64748b; font-size: 0.85rem; margin-bottom: 35px; }
        .link-card {
            display: block;
            background: #0f172a;
            border: 1px solid #1e293b;
            color: #38bdf8;
            padding: 14px;
            margin: 12px 0;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
        .link-card:hover { background: #1e293b; }
        .back { display: inline-block; margin-top: 25px; color: #64748b; text-decoration: none; font-size: 0.85rem; }
        .back:hover { color: #38bdf8; }
        footer {
            border-top: 1px solid #1f2937;
            margin-top: 50px;
            padding-top: 20px;
            color: #64748b;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <h1>LINKS</h1>
    <p class="subtitle">Official project links.</p>

    <div id="links"></div>

    <div>
        <a class="back" href="index.html">&lt; Return to Devblog</a>
    </div>

    <footer>
        &copy; 2026 NEXTSTARS & NEXTSTARS DEVELOPMENT. All rights reserved.
    </footer>

    <script>
        const links = {
            "itch.io": "https://nextstars.itch.io/lapd-simulator/",
            "discord": "https://discord.gg/24X4rc8f42",
            "github": "https://github.com/nextstars-development",
            "website": "https://development.nextstars.net/lapd-simulator/"
        };

        const container = document.getElementById('links');
        container.innerHTML = '';
        for (const [name, url] of Object.entries(links)) {
            container.innerHTML += `<a class="link-card" href="${url}" target="_blank">&gt; ${name.toUpperCase()}</a>`;
        }
    </script>
</body>
</html>
