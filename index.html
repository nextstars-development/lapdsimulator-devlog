<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPD Simulator - Devblog</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { color: #58a6ff; font-size: 1.5rem; margin: 0; }
        .nav-links a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #58a6ff; }
        .post {
            background: #111622;
            border: 1px solid #21262d;
            border-left: 3px solid #58a6ff;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 6px;
        }
        .post h2 { color: #58a6ff; margin-top: 0; font-size: 1.2rem; }
        .date { color: #8b949e; font-size: 0.85rem; margin-bottom: 12px; font-style: italic; }
        footer {
            text-align: center;
            border-top: 1px solid #30363d;
            margin-top: 50px;
            padding-top: 20px;
            color: #8b949e;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>> LAPD_SIMULATOR // DEVLOG</h1>
        <div class="nav-links">
            <a href="index.html">[Devblog]</a>
            <a href="link.html">[Links]</a>
        </div>
    </header>

    <main id="posts-container">
        <p style="color: #8b949e;">[Loading deployment logs...]</p>
    </main>

    <footer>
        &copy; 2026 NEXTSTARS & NEXTSTARS DEVELOPMENT. All rights reserved.
    </footer>

    <script>
        fetch('devlog.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                data.posts.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post';
                    postDiv.innerHTML = `
                        <h2>${post.title}</h2>
                        <div class="date">TIMESTAMP: ${post.date}</div>
                        <p>${post.summary}</p>
                    `;
                    container.appendChild(postDiv);
                });
            })
            .catch(error => {
                document.getElementById('posts-container').innerHTML = '<p style="color: #f85149;">[Error: Failed to fetch devlogs]</p>';
            });
    </script>

</body>
</html>
