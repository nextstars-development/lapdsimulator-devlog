<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPD Simulator - Devblog</title>
    <style>
        body {
            background: #090d16;
            color: #d1d5db;
            font-family: monospace;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 { color: #38bdf8; font-size: 1.3rem; margin: 0; }
        nav a { color: #9ca3af; text-decoration: none; margin-left: 10px; font-size: 0.85rem; }
        nav a:hover { color: #38bdf8; }
        .log-entry {
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .log-entry h2 { color: #38bdf8; font-size: 1.1rem; margin-top: 0; }
        .timestamp { color: #64748b; font-size: 0.8rem; margin-bottom: 10px; }
        footer {
            text-align: center;
            border-top: 1px solid #1f2937;
            margin-top: 40px;
            padding-top: 20px;
            color: #64748b;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>LAPD_SIMULATOR</h1>
        <nav>
            <a href="index.html">Devblog</a>
            <a href="link.html">Links</a>
        </nav>
    </header>

    <main id="content">
    </main>

    <footer>
        &copy; 2026 NEXTSTARS & NEXTSTARS DEVELOPMENT. All rights reserved.
    </footer>

    <script>
        const posts = [
            {
                "id": 1,
                "title": "Project Initialization & 3D Setup",
                "date": "2026-09-16",
                "summary": "Godot Engine structure setup and official repository configuration."
            }
        ];

        const container = document.getElementById('content');
        container.innerHTML = '';
        posts.forEach(p => {
            container.innerHTML += `
                <div class="log-entry">
                    <h2>${p.title}</h2>
                    <div class="timestamp">${p.date}</div>
                    <p>${p.summary}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
