<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPD Simulator - Devblog</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1, h2 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .post { background: #161b22; border: 1px solid #30363d; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
        .date { color: #8b949e; font-size: 0.9em; margin-bottom: 10px; }
        .nav-links { margin-bottom: 30px; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>> LAPD_Simulator // DEVLOG</h1>
    
    <div class="nav-links">
        [ <a href="link.html">Links</a> ] - [ <a href="https://github.com/nextstars-development/LAPD-Simulator" target="_blank">GitHub</a> ]
    </div>

    <div id="posts-container">
        <p>Loading devlogs...</p>
    </div>

    <script>
        fetch('devlog.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                data.posts.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post';
                    postDiv.innerHTML = `
                        <h2>${post.title}</h2>
                        <div class="date">Date: ${post.date}</div>
                        <p>${post.summary}</p>
                    `;
                    container.appendChild(postDiv);
                });
            })
            .catch(error => {
                document.getElementById('posts-container').innerHTML = '<p>Error loading devlogs.</p>';
            });
    </script>

</body>
</html>
